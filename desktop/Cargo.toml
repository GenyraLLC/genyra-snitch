[package]
name = "genyra-snitch-desktop"
version = "0.1.0-alpha.3"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native Rust desktop for Genyra Snitch"
repository = "https://github.com/GenyraLLC/genyra-snitch"

[[bin]]
name = "genyra-resource-probe"
path = "src/bin/resource_probe.rs"

[dependencies]
genyra-common = { path = "../crates/common" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
getrandom = "0.3"
sysinfo = "0.37"
earcutr = "0.5"
iana-time-zone = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

[profile.release]
lto = "thin"
strip = true

