<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Genyra Snitch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{height:100vh;display:flex;align-items:center;justify-content:center;background:#191d1b;color:#f1f0e9;font-family:Inter,system-ui,sans-serif;border:1px solid #424d43;border-radius:16px;overflow:hidden}.card{text-align:center;padding:30px}.mark{width:78px;height:78px;border-radius:20px;border:1px solid #796b4c;margin-bottom:22px}.wordmark{width:160px;height:auto;display:block;margin:0 auto 20px}.company{font-size:9px;letter-spacing:3px;color:#ddc594;font-weight:700}h1{font-size:30px;letter-spacing:-1.3px;margin:9px 0 12px;font-weight:700}.copy{font-size:12px;color:#b5bfb0;line-height:1.6}.status{margin-top:27px;display:flex;justify-content:center;align-items:center;gap:8px;color:#9daa96;font-size:10px}.dot{width:5px;height:5px;border-radius:50%;background:#ddc594;animation:breathe 1.6s ease-in-out infinite}@keyframes breathe{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head><body><main class="card"><img class="mark" src="logo.png" alt="Genyra LLC"><img class="wordmark" src="genyra-light.png" alt="Genyra LLC"><h1>Genyra Snitch</h1><p class="copy">Know what your apps connect to.</p><div class="status" role="status"><span class="dot"></span>Connecting to your local monitor</div></main></body></html>
