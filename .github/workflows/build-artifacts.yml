name: Build Linux artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y build-essential libpcap-dev libbpf-dev libnetfilter-queue-dev libsqlite3-dev libelf-dev zlib1g-dev clang libclang-dev pkg-config
      - run: npm --prefix ui ci
      - run: scripts/check.sh
      - run: cargo build --release --locked --manifest-path agent/Cargo.toml
      - run: scripts/bundle.sh
      - run: npm --prefix electron ci
      - run: npm --prefix electron run build:dir
      - uses: actions/upload-artifact@v4
        with:
          name: genyra-snitch-linux
          path: |
            dist/releases/
            dist/installer/linux-unpacked/
          if-no-files-found: error
